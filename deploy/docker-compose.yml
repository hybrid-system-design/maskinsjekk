# Maskinsjekk stack: MQTT broker + Go ingest/HTTP service.
# Bring up with:  docker compose up -d --build
# Host ports are overridable (e.g. MQTT_PORT=1884 HTTP_PORT=8081) so this can
# run next to another stack on the same demo laptop.
# The ",z" on bind mounts relabels them for SELinux (Fedora/RHEL); it is a
# no-op elsewhere.
name: maskinsjekk

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z

  maskinsjekk:
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      MQTT_URL: "tcp://mosquitto:1883"
      MQTT_TOPIC: "hsd/+/+/+"
      DB_PATH: "/data/maskinsjekk.db"
      MACHINES_PATH: "/config/machines.json"
      AUTO_REGISTER: "true"
      RAW_RETENTION: "168h"
      STALE_THRESHOLD: "30s"
    volumes:
      - maskinsjekkdb:/data
      - ./config:/config:ro,z

  # Optional: Bambu Lab printer status as a ground-truth sensor. Only started
  # with the "bambu" profile (COMPOSE_PROFILES=bambu in deploy/.env, see
  # .env.example). Host networking so it can hear the printer's UDP 2021
  # announcements and follow it across DHCP address changes.
  bambu-bridge:
    build:
      context: ../tools/bambu-bridge
    profiles: [bambu]
    restart: unless-stopped
    depends_on:
      - mosquitto
    network_mode: host
    environment:
      BAMBU_SERIAL: "${BAMBU_SERIAL:-}"
      BAMBU_ACCESS_CODE: "${BAMBU_ACCESS_CODE:-}"
      BAMBU_HOST: "${BAMBU_HOST:-}"
      MQTT_URL: "tcp://127.0.0.1:${MQTT_PORT:-1883}"
      TOPIC: "${BAMBU_TOPIC:-hsd/demo/printer-1/bambu}"

volumes:
  maskinsjekkdb:
