<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maskinsjekk</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1b2430; --muted: #6b7686; --line: #e3e7ed;
    --temp: #d9480f; --vib: #1c7ed6; --power: #7048e8; --ok: #2f9e44; --bad: #e03131; --active: #2f9e44;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151b; --card: #1a2029; --text: #e6eaf0; --muted: #8b96a6; --line: #2a323e;
            --temp: #ff8a4c; --vib: #5aa9ff; --power: #9775fa; --ok: #51cf66; --bad: #ff6b6b; --active: #51cf66; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; }
  select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; color: var(--muted); }
  .value { font-size: 34px; font-weight: 600; }
  .value small { font-size: 15px; font-weight: 400; color: var(--muted); }
  .range { font-size: 13px; color: var(--muted); }
  svg { width: 100%; height: 180px; display: block; margin-top: 8px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .axis { fill: var(--muted); font-size: 11px; }
  svg.band { height: 44px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Maskinsjekk</h1>
    <select id="machine" aria-label="Maskin"></select>
    <select id="range" aria-label="Tidsrom">
      <option value="900,5">Siste 15 min</option>
      <option value="3600,10" selected>Siste time</option>
      <option value="21600,60">Siste 6 timer</option>
      <option value="86400,300">Siste 24 timer</option>
    </select>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Laster…</span></span>
  </header>
  <div id="charts"></div>
</main>
<script>
// optional: the card is left out (instead of "no data") for machines that have
// no such sensor, e.g. power on a machine without a power meter.
const METRICS = [
  { id: "power_w", title: "Effekt", unit: "W", color: "var(--power)", digits: 0, optional: true },
  { id: "temp_c",  title: "Temperatur", unit: "°C", color: "var(--temp)", digits: 1 },
  { id: "vib_rms", title: "Vibrasjon (RMS)", unit: "g", color: "var(--vib)", digits: 4 },
];
// Machine state timeline: shown for any machine with a sensor publishing
// state_code (today the Bambu bridge: the printer's own gcode_state).
const STATES = {
  0: ["Ledig", "#868e96"], 1: ["Forbereder", "#f08c00"], 2: ["Printer", "#2f9e44"],
  3: ["Pause", "#fab005"], 4: ["Ferdig", "#1c7ed6"], 5: ["Feilet", "#e03131"],
  6: ["Slicer", "#7048e8"], "-1": ["Ukjent", "#adb5bd"],
};
const ACTIVE_CODES = new Set([1, 2, 3, 6]);
const STATUS_METRICS = ["state_code", "printer_reachable", "percent", "layer", "total_layers", "nozzle_c", "bed_c", "energy_wh", "output"];
const $ = id => document.getElementById(id);
const fmtTime = ms => new Date(ms).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
const fmtNum = (v, d) => v.toLocaleString("nb-NO", { minimumFractionDigits: d, maximumFractionDigits: d });

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}

async function loadMachines() {
  const { machines } = await getJSON("/machines");
  const sel = $("machine");
  const prev = sel.value;
  sel.innerHTML = "";
  for (const m of machines) {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.name || m.id;
    sel.appendChild(o);
  }
  const live = machines.find(m => !m.stale) || machines[0];
  sel.value = machines.some(m => m.id === prev) ? prev : (live ? live.id : "");
  return machines;
}

// All charts share the selected time range as x axis, so they line up.
function xScale(t0, t1, W, L, R) {
  return t => L + (t - t0) / (t1 - t0) * (W - L - R);
}

// stateSegments turns state_code buckets into [from, to, code] spans. A bucket
// holding more than one state is a transition (code null). Short gaps between
// buckets are bridged; longer ones stay empty (no data).
function stateSegments(points, bucketMS) {
  const maxGap = Math.max(3 * bucketMS, 20000);
  const segs = [];
  points.forEach((p, i) => {
    const next = points[i + 1];
    const end = next && next.ts - p.ts <= maxGap ? next.ts : p.ts + bucketMS;
    const code = p.min === p.max ? p.min : null;
    const prev = segs[segs.length - 1];
    if (prev && prev[2] === code && prev[1] === p.ts) prev[1] = end; // one block per run
    else segs.push([p.ts, end, code]);
  });
  return segs;
}

function bandSVG(segs, t0, t1) {
  const W = 800, H = 44, L = 8, R = 8, T = 4, B = 20;
  const x = xScale(t0, t1, W, L, R);
  const rects = segs.map(([a, b, code]) => {
    const xa = Math.max(x(a), L), xb = Math.min(x(b), W - R);
    if (xb <= xa) return "";
    const fill = code === null ? "var(--line)" : (STATES[code] || STATES["-1"])[1];
    return `<rect x="${xa.toFixed(1)}" y="${T}" width="${(xb - xa).toFixed(1)}" height="${H - T - B}" fill="${fill}"/>`;
  }).join("");
  return `<svg class="band" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
    `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="none" stroke="var(--line)"/>${rects}` +
    `<text class="axis" x="${L}" y="${H - 4}">${fmtTime(t0)}</text>` +
    `<text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">${fmtTime(t1)}</text></svg>`;
}

function chartSVG(points, color, digits, t0, t1, activeSpans) {
  const W = 800, H = 180, L = 8, R = 8, T = 8, B = 20;
  let lo = Math.min(...points.map(p => p.min)), hi = Math.max(...points.map(p => p.max));
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = xScale(t0, t1, W, L, R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const avg = points.map((p, i) => (i ? "L" : "M") + x(p.ts).toFixed(1) + " " + y(p.avg).toFixed(1)).join("");
  const top = points.map((p, i) => (i ? "L" : "M") + x(p.ts).toFixed(1) + " " + y(p.max).toFixed(1)).join("");
  const bot = points.slice().reverse().map(p => "L" + x(p.ts).toFixed(1) + " " + y(p.min).toFixed(1)).join("");
  const grid = [0, 0.5, 1].map(f => {
    const v = lo + (hi - lo) * f, yy = y(v);
    return `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>` +
           `<text class="axis" x="${L + 2}" y="${yy - 3}">${fmtNum(v, digits)}</text>`;
  }).join("");
  const shade = (activeSpans || []).map(([a, b]) => {
    const xa = Math.max(x(a), L), xb = Math.min(x(b), W - R);
    return xb > xa ? `<rect x="${xa.toFixed(1)}" y="${T}" width="${(xb - xa).toFixed(1)}" height="${H - T - B}" fill="var(--active)" opacity="0.08"/>` : "";
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${shade}${grid}` +
    `<path d="${top}${bot}Z" fill="${color}" opacity="0.15"/>` +
    `<path d="${avg}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<text class="axis" x="${L}" y="${H - 4}">${fmtTime(t0)}</text>` +
    `<text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">${fmtTime(t1)}</text></svg>`;
}

// statusCard renders the current state and the state timeline, or "" when
// the machine has no state_code data in the range.
function statusCard(st, segs, from, to) {
  const states = st.state_code;
  if (!states.length) return "";
  const last = (metric, maxAgeMS = 30000) => {
    const pts = st[metric];
    const p = pts[pts.length - 1];
    return p && to - p.ts <= maxAgeMS ? p : null;
  };
  const reach = last("printer_reachable");
  const cur = last("state_code");
  let title;
  const detail = [];
  if (reach && reach.max === 0) {
    title = "Utilgjengelig";
  } else if (!cur) {
    title = "Ingen status siden " + fmtTime(states[states.length - 1].ts);
  } else {
    title = (STATES[cur.max] || STATES["-1"])[0];
    const pct = last("percent"), layer = last("layer"), total = last("total_layers");
    if (ACTIVE_CODES.has(cur.max) && pct) detail.push(`${Math.round(pct.max)} %`);
    if (ACTIVE_CODES.has(cur.max) && layer && total) detail.push(`lag ${Math.round(layer.max)}/${Math.round(total.max)}`);
  }
  const temps = [["nozzle_c", "dyse"], ["bed_c", "seng"]]
    .map(([m, label]) => { const p = last(m); return p ? `${label} ${fmtNum(p.avg, 0)} °C` : ""; })
    .filter(Boolean).join(" · ");
  const seen = [...new Set(segs.map(s => s[2]).filter(c => c !== null))].sort((a, b) => a - b);
  const legend = seen.map(c => {
    const [name, color] = STATES[c] || STATES["-1"];
    return `<span><i style="background:${color}"></i>${name}</span>`;
  }).join("");
  return `<div class="card"><h2>Maskinstatus (fra printeren)</h2>` +
    `<div class="value">${title}${detail.length ? ` <small>${detail.join(" · ")}</small>` : ""}</div>` +
    `<div class="range">${temps || "&nbsp;"}</div>` +
    bandSVG(segs, from, to) + `<div class="legend">${legend}</div></div>`;
}

// powerExtras adds energy used in the range (from the meter's lifetime Wh
// counter) and warns when the meter's relay is off, since the machine then has
// no power at all.
function powerExtras(st) {
  const parts = [];
  const e = st.energy_wh;
  if (e.length) {
    const used = e[e.length - 1].max - e[0].min;
    if (used >= 0) parts.push(used >= 1000 ? `${fmtNum(used / 1000, 2)} kWh i perioden` : `${fmtNum(used, 0)} Wh i perioden`);
  }
  const o = st.output;
  if (o.length && o[o.length - 1].max === 0) parts.push(`<b style="color:var(--bad)">relé av</b>`);
  return parts.length ? " · " + parts.join(" · ") : "";
}

async function refresh() {
  const id = $("machine").value;
  if (!id) return;
  const [secs, bucket] = $("range").value.split(",").map(Number);
  const to = Date.now(), from = to - secs * 1000;
  const series = metric =>
    getJSON(`/machines/${encodeURIComponent(id)}/series?metric=${metric}&from=${from}&to=${to}&bucket=${bucket}`)
      .then(d => d.points || []).catch(() => []);
  const [results, statusResults] = await Promise.all([
    Promise.all(METRICS.map(m => series(m.id))),
    Promise.all(STATUS_METRICS.map(series)),
  ]);
  const st = Object.fromEntries(STATUS_METRICS.map((m, i) => [m, statusResults[i]]));
  const segs = stateSegments(st.state_code, bucket * 1000);
  const activeSpans = segs.filter(s => ACTIVE_CODES.has(s[2]));
  const html = statusCard(st, segs, from, to) + METRICS.map((m, i) => {
    const pts = results[i];
    if (!pts.length && m.optional) return "";
    if (!pts.length) return `<div class="card"><h2>${m.title}</h2><div class="empty">Ingen data i valgt tidsrom</div></div>`;
    const last = pts[pts.length - 1];
    const lo = Math.min(...pts.map(p => p.min)), hi = Math.max(...pts.map(p => p.max));
    const extra = m.id === "power_w" ? powerExtras(st) : "";
    return `<div class="card"><h2>${m.title}</h2>` +
      `<div class="value">${fmtNum(last.avg, m.digits)} <small>${m.unit}</small></div>` +
      `<div class="range">min ${fmtNum(lo, m.digits)} · maks ${fmtNum(hi, m.digits)} ${m.unit}${extra}</div>` +
      chartSVG(pts, m.color, m.digits, from, to, activeSpans) + `</div>`;
  }).join("");
  $("charts").innerHTML = html;
}

async function tick() {
  try {
    const machines = await loadMachines();
    const m = machines.find(x => x.id === $("machine").value);
    const dot = $("dot");
    if (m && !m.stale) {
      dot.className = "dot ok";
      $("statusText").textContent = "Mottar data";
    } else {
      dot.className = "dot bad";
      $("statusText").textContent = m && m.last_seen ? "Ingen data siden " + new Date(m.last_seen).toLocaleTimeString("nb-NO") : "Ingen data";
    }
    await refresh();
  } catch (e) {
    $("dot").className = "dot bad";
    $("statusText").textContent = "Får ikke kontakt med tjenesten";
  }
}

$("machine").addEventListener("change", refresh);
$("range").addEventListener("change", refresh);
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
